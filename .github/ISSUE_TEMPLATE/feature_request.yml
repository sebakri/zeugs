name: Feature request
description: Suggest an idea for one of the zeugs apps
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        One request per issue. React with 👍 on existing requests instead of adding "+1" comments.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - draw
        - table
        - pdf
        - note
        - box
        - site
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
