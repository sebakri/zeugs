name: Bug report
description: Something does not work as expected
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - draw
        - table
        - pdf
        - note
        - box
        - suite-ui
        - site
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: For example draw 0.2.0. See the app's About or `--version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
